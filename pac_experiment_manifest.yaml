# Provisional ASR Context (PAC) decoding experiments.
#
# Run all enabled experiments:
#   python3 scripts/run_pac_experiments.py
#
# Generate configs without running inference:
#   python3 scripts/run_pac_experiments.py --generate-only
#
# Re-score existing metrics and refresh the aggregate report:
#   python3 scripts/run_pac_experiments.py --score-only

output_root: output/pac_experiments
#directions: [en-de, en-fr, en-nl, en-pt, en-ru, en-tr]
#directions: [en-nl, en-ru, en-tr]
directions: [en-de, en-fr, en-pt]
#directions: [en-de, en-fr]
base_config: speech_processor_qwen35_9b_bnb4_smallerW.yaml

experiments:
  - id: committed_asr_lacp096
    group: main
    label: Committed ASR only, LACP 0.96s
    description: Primary committed-ASR-only baseline (central comparison).
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: false

  - id: committed_asr_check_lacp096
    group: main
    label: Committed ASR only sanity-check, LACP 0.96s
    description: Primary committed-ASR-only baseline (central comparison).
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: false

  - id: pac_lacp096
    group: main
    label: PAC, LACP 0.96s
    description: Primary PAC condition paired with committed_asr_lacp096 (central comparison).
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true

  - id: aggressive_asr_true_lacp096
    group: baseline
    label: Aggressive committed ASR, LACP threshold 5.0, 0.96s
    description: Tests whether PAC beats simply committing ASR earlier, at the central operating point.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 5.0
      sfm_speculative: false

  - id: aggressive_asr_lacp096
    group: baseline
    label: Aggressive committed ASR, LACP threshold 1.0, 0.96s
    description: Tests whether PAC beats simply committing ASR earlier, at the central operating point.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 1.0
      sfm_speculative: false

  - id: taf_lacp096
    group: baseline
    label: TAF source anticipation, LACP 0.96s (n=10)
    description: Speculative baseline with predicted source continuations and majority-vote MT.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: taf
      taf_num_continuations: 10
      taf_max_pred_words: 6
      taf_agree_thres: 0.6
      taf_min_start_words: 3
      taf_temperature: 0.7

  - id: taf_fix_lacp096
    group: baseline
    label: TAF fix (committed pool + RALCP), LACP 0.96s
    description: TAF with committed-only MT in the vote pool and RALCP-style withhold on failed vote (no beam search for now).
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: taf
      taf_num_continuations: 10
      taf_max_pred_words: 6
      taf_agree_thres: 0.6
      taf_min_start_words: 3
      taf_temperature: 0.7
      taf_include_committed_hypothesis: true
      taf_mt_beam_width: 1
      taf_ralcp_withhold: true

  - id: taf3_fix_lacp096
    group: baseline
    label: TAF fix n=6 (committed pool + RALCP), LACP 0.96s
    description: Same as taf_fix_lacp096 but with 6 source continuations instead of 10 for lower compute.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: taf
      taf_num_continuations: 3
      taf_max_pred_words: 6
      taf_agree_thres: 0.6
      taf_min_start_words: 3
      taf_temperature: 0.7
      taf_include_committed_hypothesis: true
      taf_mt_beam_width: 1
      taf_ralcp_withhold: true

  - id: taf6_fix_lacp096
    group: baseline
    label: TAF fix n=6 (committed pool + RALCP), LACP 0.96s
    description: Same as taf_fix_lacp096 but with 6 source continuations instead of 10 for lower compute.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: taf
      taf_num_continuations: 6
      taf_max_pred_words: 6
      taf_agree_thres: 0.6
      taf_min_start_words: 3
      taf_temperature: 0.7
      taf_include_committed_hypothesis: true
      taf_mt_beam_width: 1
      taf_ralcp_withhold: true

  - id: taf1_lacp096
    group: baseline
    label: TAF-1 greedy continuation, LACP 0.96s (n=1)
    description: Cheap TAF sanity check with one greedy source continuation per step.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: taf
      taf_num_continuations: 1
      taf_max_pred_words: 6
      taf_agree_thres: 1.0
      taf_min_start_words: 3
      taf_temperature: 0.0

  - id: ssbd_lacp096
    group: baseline
    label: SSBD re-translation, LACP 0.96s (beta=0.2)
    description: Self-speculative biased decoding baseline for faster re-translation compute.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_bias_beta: 0.2
      ssbd_mask_k: 0

  - id: ssbd_batched_lacp096
    group: baseline
    label: SSBD batched verify (beta=0), LACP 0.96s
    description: Single-call greedy draft verification (Option A); one vLLM generate per step instead of per-token prefills.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_batched_verify: true
      ssbd_bias_beta: 0.0
      ssbd_mask_k: 0

  - id: ssbd_batched_bias_lacp096
    group: baseline
    label: SSBD batched biased verify (beta=0.2), LACP 0.96s
    description: Batched SSBD with paper-style biased draft verification (beta=0.2) via vLLM logits processor; LCP emission.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_batched_verify: true
      ssbd_bias_beta: 0.2
      ssbd_mask_k: 0

  - id: ssbd_raw_batched_lacp096
    group: baseline
    label: SSBD raw batched verify (paper emission), LACP 0.96s
    description: Batched SSBD with bounded raw retranslation (12-word window); emits deletions only in the unstable tail.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_batched_verify: true
      ssbd_bias_beta: 0.0
      ssbd_mask_k: 0
      ssbd_raw_emission: true
      ssbd_retranslation_window: 12

  - id: ssbd_raw_batched_bias_lacp096
    group: baseline
    label: SSBD raw batched biased verify (beta=0.2), LACP 0.96s
    description: Batched biased SSBD (beta=0.2) with bounded raw retranslation (12-word window).
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_batched_verify: true
      ssbd_bias_beta: 0.2
      ssbd_mask_k: 0
      ssbd_raw_emission: true
      ssbd_retranslation_window: 12

  - id: ssbd_lacp064
    group: chunk_grid
    label: SSBD re-translation, LACP 0.64s (beta=0.2)
    description: Smaller acoustic window ablation for SSBD draft acceptance.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.64
      sfm_chunk_secs: 0.64
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_bias_beta: 0.2
      ssbd_mask_k: 0

  - id: ssbd_maskk5_lacp096
    group: baseline
    label: SSBD + display-only mask-5, LACP 0.96s
    description: SSBD with display-only mask-k (k=5) to reduce flicker without losing draft tokens.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: ssbd
      ssbd_bias_beta: 0.2
      ssbd_mask_k: 5

  - id: committed_asr_new_lacp096
    group: baseline
    label: Committed ASR only (agent_simulstream_new), LACP 0.96s
    description: Fair committed-ASR control using the same agent as TAF/SSBD baselines.
    base_config: speech_processor_qwen35_9b_bnb4_baselines.yaml
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      mt_lookahead_mode: none

  - id: committed_asr_lacp064
    group: chunk_grid
    label: Committed ASR only, LACP 0.64s
    overrides:
      speech_chunk_size: 0.64
      sfm_chunk_secs: 0.64
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: false

  - id: pac_lacp064
    group: chunk_grid
    label: PAC, LACP 0.64s
    overrides:
      speech_chunk_size: 0.64
      sfm_chunk_secs: 0.64
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true

  - id: pac_lacp128
    group: chunk_grid
    label: PAC, LACP 1.28s
    overrides:
      speech_chunk_size: 1.28
      sfm_chunk_secs: 1.28
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true

  - id: committed_asr_lacp128
    group: chunk_grid
    label: Committed ASR only, LACP 1.28s
    overrides:
      speech_chunk_size: 1.28
      sfm_chunk_secs: 1.28
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: false

  - id: pac_no_boundary096
    group: ablation
    label: PAC without alignment boundary control
    description: Feeds provisional ASR context but does not split stable/provisional target regions.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: false
      pac_emit_provisional_target: true

  - id: pac_hidden_context096
    group: ablation
    label: PAC hidden context only
    description: Uses provisional ASR as MT context but emits only target text aligned before the provisional source boundary.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: false

  - id: pac_cap4_096
    group: ablation
    label: PAC with 4-word provisional ASR cap
    description: Tests whether a short provisional ASR suffix captures most of the gain.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      sfm_speculative_max_words: 4
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true

  - id: pac_tagged096
    group: ablation
    label: Tagged PAC, separated committed/provisional prompt
    description: Exposes committed vs provisional ASR to the LLM as a tagged prompt; PAC machinery still controls emission, promotion, and retraction.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true
      pac_tagged_prompt: true

  - id: pac_tagged_hidden096
    group: ablation
    label: Tagged PAC hidden context only
    description: Tagged committed/provisional prompt, but emits only target text aligned before the provisional source boundary.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: false
      pac_tagged_prompt: true

  - id: pac_noisy_asr096
    group: ablation
    label: PAC with degraded ASR audio
    enabled: false
    description: Adds reproducible 20 dB audio noise before ASR to test PAC robustness under noisier ASR hypotheses.
    overrides:
      speech_chunk_size: 0.96
      sfm_chunk_secs: 0.96
      sfm_policy: LACP
      sfm_lacp_threshold: 2.0
      sfm_speculative: true
      pac_use_alignment_boundary: true
      pac_emit_provisional_target: true
      audio_noise_snr_db: 20.0
      audio_noise_seed: 13

  - id: offline_upper_bound
    group: upper_bound
    label: Offline or full-sentence ASR-to-MT upper bound
    enabled: false
    description: Fill this row with an external offline run if available; PAC reports will include it once scores.tsv exists.
    output_dir: output/pac_experiments/offline_upper_bound
